name: Security Scan
description: Scan databases for security issues with Atlas
branding:
  icon: database
author: 'Ariga'
inputs:
  fail-on:
    description: |
      The lowest severity that fails the action. By default, reported issues do not
      fail it, and only a database that could not be scanned does.
  ignore:
    description: |
      CVE identifier(s) not to report. For example: `CVE-2017-18359`.
  min-severity:
    description: |
      The lowest severity to report. For example, `HIGH` reports only the `HIGH`
      and `CRITICAL` issues.
  urls:
    description: |
      URL(s) of the target databases, one per line.
      For example: `postgres://localhost:5432/app?sslmode=disable`.
      If not set, Atlas uses the [`url`](https://atlasgo.io/hcl/config#env.url) from the config file.
      Read more about [Atlas URLs](https://atlasgo.io/concepts/url).
  working-directory:
    description: Atlas working directory. Default is project root
  config:
    description: |
      The URL of the Atlas configuration file. By default, Atlas will look for a file
      named `atlas.hcl` in the current directory. For example, `file://config/atlas.hcl`.
      Learn more about [Atlas configuration files](https://atlasgo.io/atlas-schema/projects).
  env:
    description: |
      The environment to use from the Atlas configuration file. For example, `dev`.
  vars:
    description: |
      A JSON object containing variables to be used in the Atlas configuration file.
      For example, `{"var1": "value1", "var2": "value2"}`.
outputs:
  count:
    description: The number of security issues that were reported.
  failures:
    description: The number of databases that could not be scanned.
  report:
    description: |
      A JSON report of the scan, containing the issues found in each scanned database.
runs:
  using: node24
  main: index.js
